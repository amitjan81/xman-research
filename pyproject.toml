[project]
name = "xman-research"
version = "0.1.0"
description = "Options research platform (MVP)"
requires-python = ">=3.12"
dependencies = [
    # C2 (session store) reads the producer's parquet corpus and needs an NSE trading
    # calendar. pandas_market_calendars is a hard dependency on purpose: a hand-written
    # holiday list is the failure this project has already paid for once.
    #
    # Floors are what has actually been validated, not the oldest version that might
    # work. Every fact this package pins — the manifest digests agreeing on all 119 real
    # sessions, the 161-session count, the 2026-12-25 end of the holiday table, the
    # 2026-01-15 erratum — was established on pandas 3.0.5 and pmc 5.4.0. pandas 2.2 risks
    # a different DataFrame.to_csv float rendering, which would turn every verification
    # into a false ChecksumMismatchError; pmc 4.4's older holiday table would reject every
    # current range through CalendarCoverageError. Both fail loudly, and a floor that
    # admits them buys nothing except that failure on somebody else's machine.
    "pandas>=3.0",
    "pyarrow>=16",
    "pandas_market_calendars>=5.4",
    # C6's CSCV enumerates C(16,8) = 12,870 symmetric splits and computes a Sharpe per
    # configuration on each. Declared explicitly rather than leant on through pandas:
    # `tests/test_no_caller_supplied_count.py` imports every module in the package, so an
    # undeclared transitive import fails the whole guard rather than one test.
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xman_research"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Deliberately NO pytest-xdist dependency and no -n flag: this host is shared with a
# live trading platform, so an uncapped worker fan-out is a production risk. If xdist
# is ever added, cap it at -n 4.

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The exploratory trees and the markdown specs predate this package and are explicitly
# out of scope: rewriting prior research is not this component's business.
#
# The "*.md" entry is load-bearing and was verified, not assumed. `ruff format` reformats
# Python code blocks *embedded in Markdown* (confirmed on ruff 0.16.2: dropping this entry
# and running `ruff format .` rewrote 345 lines of RESEARCH_SUMMARY.md's code samples —
# quote style, line wrapping — none of it this package's code). Do not remove it on the
# reasoning that "ruff only looks at .py files"; that was true of older versions and is
# not true here.
extend-exclude = ["lib", "research", "strategies", "forex", "symbolSchemaFile", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

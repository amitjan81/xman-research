grid = {hold_sessions = [1, 3, 5], atr_multiple = [1.0], wing_atr_multiple = [1.0], gap_sigmas = [1.0, 1.5], target_notional = [5_000_000]}

# --------------------------------------- conditioner: sessions-to-expiry band
# The band is a pair of parameters, so the two points are two blocks per
# structure rather than two values on one axis: a single block crossing
# low = [1, 6] with high = [5, 15] would also expand the incoherent [1, 15] and
# the empty [6, 5].

[[candidates]]
template = "short_atm_straddle_expiry_distance"
grid = {hold_sessions = [1, 3, 5], expiry_distance_low = [1.0], expiry_distance_high = [5.0], target_notional = [5_000_000]}

[[candidates]]
template = "short_atm_straddle_expiry_distance"
grid = {hold_sessions = [1, 3, 5], expiry_distance_low = [6.0], expiry_distance_high = [15.0], target_notional = [5_000_000]}

[[candidates]]

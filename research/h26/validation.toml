# H26 validation configuration — the three decisions that must not be taken while looking
# at a result, so C6 reads them from here rather than accepting them per call.

# The canonical trial log for the H1/H26 FAMILY. Every count the deflated Sharpe uses is
# read from this file and no other.
#
# THE PATH IS ABSOLUTE AND OUTSIDE EVERY WORKTREE, AND THAT IS THE POINT. H1's log was
# written inside the H1 worktree and vanished when that worktree was removed during
# post-merge cleanup, taking the only auditable evidence for H1's trial count with it. A
# count that lives inside a disposable directory is a count that will eventually be
# reconstructed from prose. /home/qa/runtime/data/ is the durable data root; `research/`
# is a new subdirectory created for this file and nothing here writes to the read-only
# corpus under backtest/.
#
# What makes the count CORRECT is the amendment's parent link; what makes it SURVIVE is
# this path. The log is seeded with H1's replayed row before H26 runs — see
# gate.toml's trial inventory, and xman_research.h26.h1_replay for the mechanism and its
# refusal branch.
#
# It is NOT committed: `*.db` is gitignored repo-wide and forcing an exception for one file
# would change a repo convention to suit one branch. research/h26/trial_log_export.json IS
# committed, and unlike H1's — which DECISION.md cited but which was never actually written
# — it is produced by the decision run itself.
trial_log_path = "/home/qa/runtime/data/research/trial_log.db"

gate_path = "gate.toml"

# THE HOLDOUT BOUNDARY, INHERITED FROM H1 UNCHANGED.
#
# This is not a fresh choice and must not be re-cut. H26 is an amendment of H1, so it is in
# the same family, and 2026-05-01 is the date H1 sealed and did not read. The vendor
# backfill of 2026-06-13..2026-08-12 was NOT used to push this boundary later; it enlarged
# the sealed region from 29 sessions to 71. gate.toml's `holdout_disposition` gives the
# full reasoning and states the price paid for it.
holdout_first_date = 2026-05-01

underlying = "NIFTY"

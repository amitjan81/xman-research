      PASS. minimum ratio 0.7610 on 2025-12-01 (spot 26,281.15, L = 75).
      385 sessions checked, none without a spot at the decision minute.

Because floor(x + 1/2) >= 1 exactly when x >= 0.5, a passing check means no session on
this window reaches M1 §5's n_t = 0 branch, so M1 §4's corresponding suppression never
fires and *which sessions trade* does not depend on the contract multiplier. That is the
whole point of the check and it is the reason the sizing floor could be dropped.

A SECOND MINIMUM IS REPORTED, AND IT IS NOT REDUNDANCY. §12.1 names reference_lot_size.
The ENGINE sizes on the DECLARED lot size — engine.py says so, citing the owner decision
of 2026-08-13 that turned an unoverridable refusal into a stamp, and Contract.lot_size is

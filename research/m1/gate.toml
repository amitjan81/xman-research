# M1 decision gate — the thresholds, written down BEFORE the run.
#
# Committed in its own commit, ahead of the commit carrying any result, for the reason
# research/h1/gate.toml gives: a `recorded_at` inside a file is a string the author typed,
# and git history is what makes a pre-registration checkable.
#
# THIS GATE SUPERSEDES research/h1/gate.toml. That file is NOT edited. It graded an
# 80-session window and it stays in the repository, unchanged, saying so. Both are visible
# in history and the difference between them is one thing: the window. Everything that
# follows is an argument about what a 385-session window does to a bar sized for 80.
#
# =======================================================================================
# THE SAMPLE, WHICH SIZES EVERYTHING ELSE
#
# Costable window, from M1 §13 and not from preference: 2024-10-01 .. 2026-08-03.
#   * Before 2024-10-01 the securities transaction tax rates are UNDEFINED — the cost
#     stack raises RateNotInForceError rather than guessing, so no session before that
#     date can be costed at all.
#   * After 2026-08-03 NSE settles on the Closing Auction Session price, a rule the
#     settlement table carries with implemented=false and REFUSES to settle against. M1
#     holds to settlement, so the refusal is reachable and the ceiling is real.
#
# Resolved against the corpus with SessionStore.resolve:
#   costable window   2024-10-01..2026-08-03:  449 found / 452 expected, 3 missing
#   IN-SAMPLE         2024-10-01..2026-04-30:  385 found / 388 expected, 3 missing
#   HOLDOUT           2026-05-01..2026-08-03:   64 found /  64 expected, COMPLETE
#
# 385 sessions is 384 return observations, and 384 is the number every bar below is sized
# against. IT IS NOT 449. 449 is the costable window, which spans the holdout; the graded
# in-sample sample stops at the boundary H1 sealed. Conflating the two would size the bars
# against 65 sessions nobody is allowed to look at.
#
# THE GAP POLICY, decided and implemented rather than discovered at run time. All three
# missing sessions fall in-sample: 2024-11-20, 2025-04-30 and 2025-05-08. The run passes
# `accept_gaps` a written reason naming all three. The window is NOT narrowed to avoid
# them — narrowing either fragments the trial or discards roughly 140 sessions including
# the regime change itself.
#
# 2024-11-20 IS ITSELF AN EPOCH BOUNDARY (weekly expiry cull, contract size increase,
# expiry-day ELM), and losing it costs little for a reason worth writing down: it was a
# Wednesday, and pre-Tuesday-change expiries fell on Thursdays, so no settlement is lost.
# The boundary merely lacks its first day's marks, which biases neither side of it.
# =======================================================================================


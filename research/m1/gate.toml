# =======================================================================================

# =======================================================================================
# THE PER-EPOCH BREAKDOWN, pre-registered so it cannot become a narrative escape hatch.
#
# A FAILS_THRESHOLD pooled verdict sitting beside one attractive regime reads, in prose,
# as a pass. So its status, its form and its predicted direction are fixed here, before
# any of it is computed.
#
# STATUS: DESCRIPTIVE, UNGRADED, and incapable of changing the outcome. No threshold reads
# it. It appears in DECISION.md under a heading that says so. Grading it would require
# six separate trials, would deflate all six Sharpes, and would hand the researcher a
# post-hoc choice of which regime to believe — which is the whole failure mode.
#
# FORM: the in-sample daily net return series partitioned by the six epoch boundaries
# above, each partition attributed to the epoch in force on the session date. Per epoch:
# session count, net P&L, annualised Sharpe, maximum drawdown, cost-breakeven multiple.
# The same statistics as the pooled run, computed on the same series, sliced.
#
# PREDICTED SIGN, committed in advance: the mechanism (intermediation rent) predicts a
# POSITIVE mean net return in EVERY epoch, because dealer capacity constraints are not a
# feature of any one regulatory regime. The most likely genuine exception is
# weekly_expiry_cull_2024, which cut the supply of weekly expiries and could plausibly
# have compressed the rent. Reported whichever way it points.
#
# WHAT IT CANNOT SUPPORT: the smallest partitions are short. No epoch with fewer than
# roughly 60 sessions can carry a Sharpe worth reading, and none will be claimed for one.
# =======================================================================================

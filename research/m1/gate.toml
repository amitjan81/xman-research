  AS EXECUTED (L_t = declared lot size):
      PASS. minimum ratio 0.8767 on 2026-01-05 (spot 26,323.90, L = 65).

Both pass, and on this window the discrepancy runs in the SAFE direction: where the two
disagree the declared value is the smaller (65 against a bars-supported 75), so the engine

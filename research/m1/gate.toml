# =======================================================================================
# IN-SAMPLE THRESHOLDS
# =======================================================================================

[thresholds]

# RECALIBRATED, and the calibration contradicted the expectation that prompted it.
#
# Synthetic Gaussian series at 384 observations, graded through this package's own
# deflated_sharpe_ratio, 40 seeds per point. The realised family trial count at M1's
# grading will be SIX (inventory below), so N=6 is the row that governs.
#
# Reproduce: uv run python -m xman_research.h1.calibrate_thresholds \
#              --case 384:6 --bar 0.80 --bar 0.90 --bar 0.95
#
#   true ann. Sharpe:   0.0    0.5    1.0    1.5    2.0    2.5    3.0
#   median DSR:        0.246  0.472  0.707  0.876  0.960  0.990  0.998
#   share >= 0.80:      2.5%  17.5%  30.0%  57.5%  80.0%  85.0%  95.0%
#   share >= 0.90:      0.0%   2.5%  22.5%  40.0%  60.0%  82.5%  87.5%
#   share >= 0.95:      0.0%   0.0%   7.5%  25.0%  52.5%  72.5%  82.5%
#
# THE 0.0 ROW IS NEW. It is the null, it is the only row on which a false-positive rate
# can be read, and it was absent when H1's and H26's bars were argued — both were reasoned
# from the power side alone. Adding it changes no number either of them published.
#
# WHAT THE GRID SAYS, against what was expected. The expectation going in was that more
# observations make the deflation bite harder, so the bar must come down. It is the other
# way round. The deflation term grows with TRIALS; the estimate sharpens with
# OBSERVATIONS, and n moved by a factor of five while N moved by one. Compare like for
# like at a fixed N=6: at n=79 a true annualised Sharpe of 3.0 has a median DSR of 0.704,
# and at n=384 it has 0.998. The same bar that was unreachable on H26's sample is
# comfortable on this one.
#
# SO THE BAR STAYS AT 0.90, and staying is a recalibration, not an inheritance — the grid
# above is the argument, and it is a different argument from H1's.
#
#   * Not auto-failing. H1 rejected an auto-failing bar because it "tells the operator
#     nothing at all". At N=6, 0.90 is cleared by a true Sharpe of 2.0 in 60% of draws and
#     3.0 in 87.5%. It has real power against real effect sizes.
#   * Not a non-gate. H1 rejected 0.60-0.70 because "a gate that admits noise a third of
#     the time is not a gate". At 0.90 noise clears in 0.0% of 40 draws.
#   * It is STRICTER than what H1 bought. H1's own gate says its 0.90 "buys a 10%
#     false-positive rate" at 80 observations and one trial. At 384 observations and six
#     trials the same number buys ~0%, with MORE power than H1 had, not less.
#
# WHY NOT 0.80, which the grid also supports (2.5% false positives, 57.5% power at a 1.5
# Sharpe against 0.90's 40%). Because lowering a bar as the sample grows is the wrong
# direction of error, and it is the direction that manufactures false positives rather
# than costing true ones. The extra power 0.80 buys is power against a 1.0-1.5 Sharpe,
# which is exactly the region H1 recorded this apparatus cannot resolve honestly. Between
# an error that costs a true positive and one that manufactures a false one, this
# repository has consistently taken the first, and does so again here.
#
# WHY NOT 0.95. It would be defensible on false positives — also 0%. It costs 15 points of
# power at a 1.5 Sharpe for no measurable gain in false-positive control, and raising a bar
# above the level a superseded gate registered, on a hypothesis already known to have
# missed, invites exactly the suspicion that it was raised to guarantee the miss. 0.90 is
# the number already on the record; keeping it is the move that cannot be read that way.
#
# Pre-written, because it is the honest reading of a miss: at 384 observations this test
# CAN resolve a true annualised Sharpe of 2.0 or better. A miss at 0.90 here is therefore
# a materially stronger statement than H1's miss was — it is evidence against an effect of
# that size, not merely evidence of insufficient data. It remains uninformative about a
# true Sharpe below roughly 1.0.
deflated_sharpe = { at_least = 0.90 }

# INHERITED FROM H1 DELIBERATELY, and inheritance is correct here for a stated reason: this
# bar is a tolerance for UNMODELLED cost, and it is the one criterion sample length does
# not touch. What is unmodelled is unchanged — bid-ask spread, market impact, slippage
# between the decision minute and the fill, since fills are at the bar close with s = 0 bps
# by M1 §7's deliberately optimistic default. The trade structure is unchanged: two
# spread-bearing entry legs per expiry cycle, exits by cash settlement which cross no
# spread. Nothing that determines this number moved, so this number does not move.
cost_breakeven_multiple = { at_least = 2.0 }

# KEPT AT 0.10, AND IT IS NOW A STRICTLY HARDER BAR THAN IT WAS. That is not an oversight.
#
# Maximum drawdown is monotone in window length: a longer window can only contain more
# opportunities for the worst peak-to-trough to occur, so 0.10 over 385 sessions is a
# materially stronger demand than 0.10 over 80. H1 measured 6.1% on 80 sessions; nothing
# guarantees 385 sessions across six regimes stay under 10%.
#
# It is kept because it is a bound on the LOSS, not on the drawdown-to-margin ratio —
# H26's re-derivation, which corrected H1's mistaken "one lot ties up around 15% of
# capital" premise against a measured peak margin of 47.6%. Ten per cent of a 10,00,000
# capital base lost by this book is the point at which the strategy has stopped being the
# thing described, and that point does not move because the window got longer.
#
# Relaxing a ruin bar BECAUSE the window grew would be the clearest possible instance of
# the move this apparatus exists to prevent: the sample changed, the bar became harder to
# clear, and the response was to make it easier. Recorded in advance: if M1 fails on
# max_drawdown alone, the correct reading is that a 19-month unconditional short-straddle
# book drew down past a tenth of its capital, which is a true and useful finding and not
# an artefact of the bar.
max_drawdown = { at_most = 0.10 }

# STRUCTURALLY CANNOT FAIL, exactly as H1 recorded. M1 is the unconditional expression of
# H1, which is what strategies.py names as the naive benchmark, so candidate and benchmark
# are the same portfolio over the same window under the same cost model and the increment
# is identically 0.0. It is recorded anyway rather than omitted: omitting it would leave
# spec §3 C6's criterion unrecorded, and adding it later — once a conditional variant
# exists and it can bite — would be a threshold written after seeing results.
risk_matched_increment = { at_least = 0.0 }

# NOT GATED, deliberately, on H1's reasoning unchanged: `pbo` (one configuration is run, so
# CSCV has nothing to compare, and manufacturing a grid would add trials that deflate the
# very Sharpe the grid was invented to validate); `annualised_sharpe` (subsumed by
# deflated_sharpe, and gating both lets the same evidence fail the run twice); and
# `expected_shortfall` (max_drawdown already carries the tail criterion in the units an
# operator sizes against).

# =======================================================================================
# HOLDOUT THRESHOLDS — recorded now, at the same moment as the others, because after the
# in-sample verdict is exactly when they may no longer be recorded.
#
# The holdout is 2026-05-01 .. 2026-08-03: 64 sessions, 63 return observations, complete.
# It ends at M1's costable ceiling, not at the corpus end, because M1 HOLDS TO SETTLEMENT
# and the Closing Auction Session rule from 2026-08-03 refuses to settle.
#
# At holdout grading the family will hold EIGHT trials: the six below, plus the touch row
# the holdout read itself writes, plus the holdout run.
#
#   true ann. Sharpe:   0.0    0.5    1.0    1.5    2.0    2.5    3.0
#   median DSR (63,8): 0.090  0.131  0.184  0.249  0.334  0.429  0.528
#   share >= 0.50:      7.5%  15.0%  25.0%  32.5%  35.0%  40.0%  57.5%
#
# 0.50 is the minimal confirmatory statement — after deflation the unseen months still
# favour a positive true Sharpe more likely than not — and at 7.5% noise clearance it is
# not a non-gate. It is WEAK, and that is stated rather than hidden: 63 observations
# against eight trials cannot establish an edge, only fail to contradict one. That is the
# holdout's job here.
# =======================================================================================

[holdout_thresholds]
deflated_sharpe = { at_least = 0.50 }
cost_breakeven_multiple = { at_least = 2.0 }
max_drawdown = { at_most = 0.10 }
risk_matched_increment = { at_least = 0.0 }

# =======================================================================================
# NOT-EVALUABLE RULES — spec §6's fourth outcome, checked before pass/fail. Left at C6's
# defaults, which is itself the decision and is recorded as one: they were NOT set after
# looking at a run, and nothing has computed an infeasible or stale fraction against this
# window. FAILS_THRESHOLD and NOT_EVALUABLE are both successful deliverables here; the
# fourth outcome is the one a disappointing result is most tempting to reclassify into,
# or out of, which is why these are not touched.
# =======================================================================================

[not_evaluable]
max_infeasible_fraction = 0.10
max_stale_fraction = 0.20
optimistic_costs_below = 1.0

